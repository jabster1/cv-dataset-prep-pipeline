# Example pipeline config — works out of the box with the synthetic demo data:
#
#   python examples/make_synthetic_raw.py
#   python -m cv_pipeline prepare --config configs/example.yaml
#
# Relative paths below are resolved against `root`, which is itself relative to THIS
# file's directory. `root: ..` therefore means "the repository root".

root: ..
log_level: INFO

project:
  name: example
  workspace: workspaces/example   # every generated file goes here
  seed: 42                        # drives all randomness (splits, augmentation)

# Class names, in YOLO class-id order. Written verbatim into dataset.yaml.
classes:
  - square
  - circle
  - triangle

ingest:
  raw_dir: data/example/raw       # read-only; recommended layout: raw/images, raw/videos
  image_extensions: [.jpg, .jpeg, .png, .webp]
  video_extensions: [.mp4, .mov]
  video:
    mode: fps                     # fps | every_n_frames
    fps: 2.0                      # used when mode=fps
    every_n_frames: 15            # used when mode=every_n_frames
    max_frames: 50                # per video; null = no limit
    max_frames_strategy: uniform  # uniform (spread across video) | first
    image_format: jpg             # jpg | png
    jpeg_quality: 95

dedup:
  enabled: true
  hash_size: 8                    # perceptual hashes are hash_size^2 bits
  near_duplicate_threshold: 6     # max pHash Hamming distance for a near-duplicate
  dhash_threshold: 10             # AND max dHash distance (null = pHash only)
  exact_duplicate_action: exclude # exclude | keep — byte/pixel-identical copies
  near_duplicate_action: keep     # keep | exclude — cross-source near-duplicates
  group_near_duplicates: true     # keep near-duplicates in the same split
  # Nothing is ever deleted: "exclude" only marks items in manifests/dedup.csv.
  # Similar frames from the SAME video are never linked or excluded (reported only).

annotation:
  enabled: false                  # prepare runs annotate only when true; the synthetic demo
                                  # has no detector for its shapes
  backend: yolo                   # registered backend name
  model: null                     # e.g. models/my_detector.pt — checked only when annotate
                                  # runs; models are never downloaded automatically
  confidence_threshold: 0.25      # boxes below this are discarded (still recorded for audit)
  review_threshold: 0.5           # candidate boxes below this send the item to review
  inference_confidence_floor: 0.05  # lowest confidence requested from the model (audit trail)
  iou_threshold: 0.7
  imgsz: 640
  batch_size: 1                   # 1 keeps results independent of batch composition
  max_detections: 300
  device: null                    # null = auto, or "cpu", "0", "mps"
  class_map: {}                   # model label -> project class (same names map implicitly)
  review_empty: true              # items with no candidate boxes go to review
  review_unmapped_classes: false  # items with boxes of unmapped model classes go to review
  review_sample_rate: 0.05        # deterministic audit sample of otherwise-unflagged items
  options: {}                     # backend-specific, e.g. {agnostic_nms: true}

review:
  export: flagged                 # flagged | all — which items go to review/
  copy_images: true               # copy images into review/images for labeling tools
  previews: true                  # draw predictions into review/previews

# Existing labeled datasets (YOLO / Roboflow exports). Importing is always explicit:
#   python -m cv_pipeline import-dataset --config configs/example.yaml --name <name>
# Imported images join the same corpus (dedup, split groups, split history) as raw data.
# Their legacy train/valid/test split is kept as metadata only.
imports: []
#  - name: roboflow_v3                # [a-z0-9_-]; imports are immutable, use a new name per version
#    path: data/legacy/roboflow_v3    # export dir with data.yaml (read-only; never modified)
#    format: yolo
#    labels_trusted: true             # made by people -> provenance human_imported (trusted)
#    empty_labels_are_negatives: false  # empty label files = confirmed "no objects"
#    ignored_only_labels_are_negatives: false  # files whose boxes are ALL ignored classes
#    class_map: {}                    # source class name -> project class
#    ignore_classes: []               # source classes deliberately dropped

split:
  # Fractions of items (they must sum to 1; val/test may be 0). Split groups from dedup are
  # indivisible, so achieved fractions can deviate; the report explains how and why.
  train: 0.7
  val: 0.2
  test: 0.1
  seed: null                      # tie-break seed for NEW groups; null = project.seed
  require_nonempty: true          # give every requested split at least one new group if possible
  # Assignments persist: existing groups never move. If later grouping merges groups that
  # were assigned to different splits, `split` stops (exit 4). A targeted fix may only keep
  # the most protected historical split (test > val > train), e.g. {sg_3fa9c0e1b2d4: test}.
  # Anything else requires `split --resplit` (preview, reason, confirmation token).
  conflict_resolutions: {}

augmentation:
  enabled: false                  # prepare runs `augment` only when true
  label_policy: trusted_only      # trusted_only | allow_machine_unreviewed (dev/POC opt-in)
  allow_machine_empty: false      # machine zero detections as negatives (opt-in only)
  variants_per_item: 2            # augmented variants per eligible TRAIN item (val/test never)
  seed: null                      # null -> project.seed
  min_visibility: 0.5             # a box less visible than this after a transform is "lost"
  min_box_area: 16                # pixels^2
  allow_partial_box_loss: false   # positives losing any box are retried; losing all: always
  max_attempts: 5                 # deterministic retries per variant, then rejected
  image_format: jpg
  jpeg_quality: 95
  # Overrides of the conservative defaults (cv_pipeline/augmentation/transforms.py):
  # on: brightness_contrast, hue_saturation_value (hue 0), gaussian_blur, gauss_noise,
  #     image_compression, affine (scale/translate, no rotation)
  # off: horizontal_flip, rotate, gamma, perspective, bbox_safe_crop
  transforms: {}

export:
  enabled: false                  # prepare runs `export` only when true
  label_policy: trusted_only      # must match `labels` (and `augment`) — see README
  allow_machine_empty: false
  evaluation_policy: strict       # strict: refuse if any val/test item lacks a trusted label
                                  # non_strict: export usable items, marked incomplete_evaluation_set
  augmentation_run: latest        # latest | none | <augmentation run id>
  classes: null                   # training taxonomy (ordered subset); null = all project classes
  non_target_classes: error       # error | drop_boxes (positives left box-free are excluded)

training:
  initialization:
    model: models/yolo11n.pt      # local weights file (root-relative); stock names need allow_download
    mode: pretrained              # pretrained (stock COCO base, new head) | finetune (same classes)
    allow_download: false         # also switches off amp and plots (known download paths)
  augmentation_policy: pipeline_only  # Phase 5 owns augmentation; Ultralytics' is disabled
  epochs: 50
  imgsz: 640
  batch: 16                       # -1 = auto
  device: null                    # null/auto | cpu | mps | 0 | 0,1 | cuda:0
  workers: 4
  patience: 20
  seed: null                      # null -> project.seed
  deterministic: true
  cache: none                     # none | ram | disk
  allow_incomplete_evaluation: false
  evaluate_test: true
  trainer_args: {}                # allowlisted Ultralytics args, e.g. {lr0: 0.005, optimizer: AdamW}
