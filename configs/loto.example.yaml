# Lockout/Tagout (LOTO) detection — template config.
# Copy to configs/loto.yaml, adjust class names / model path, then:
#
#   python -m cv_pipeline prepare  --config configs/loto.yaml
#   python -m cv_pipeline validate --config configs/loto.yaml
#   python -m cv_pipeline train    --config configs/loto.yaml
#
# Nothing in the pipeline is LOTO-specific: the same config shape works for tools,
# industrial equipment, or any other detection project.

root: ..
log_level: INFO

project:
  name: loto
  workspace: workspaces/loto
  seed: 1337

classes:
  - padlock
  - lockout_tag
  - hasp
  - valve_lockout
  - breaker_lockout

ingest:
  raw_dir: data/loto/raw          # data/loto/raw/images, data/loto/raw/videos
  video:
    mode: fps
    fps: 1.0                      # walk-through videos are highly redundant; 1 fps is plenty
    max_frames: 200
    max_frames_strategy: uniform
    image_format: jpg
    jpeg_quality: 95

dedup:
  enabled: true
  hash_size: 8                    # perceptual hashes are hash_size^2 bits
  near_duplicate_threshold: 6     # max pHash Hamming distance for a near-duplicate
  dhash_threshold: 10             # AND max dHash distance (null = pHash only)
  exact_duplicate_action: exclude # exclude | keep — byte/pixel-identical copies
  near_duplicate_action: keep     # keep | exclude — cross-source near-duplicates
  group_near_duplicates: true     # keep near-duplicates in the same split
  # Nothing is ever deleted: "exclude" only marks items in manifests/dedup.csv.
  # Similar frames from the SAME video are never linked or excluded (reported only).

annotation:
  enabled: true
  backend: yolo
  model: models/loto_bootstrap.pt # an existing detector used to pre-label (never downloaded)
  confidence_threshold: 0.25
  review_threshold: 0.6
  inference_confidence_floor: 0.05
  iou_threshold: 0.7
  imgsz: 960                      # small objects (tags, hasps) benefit from higher res
  batch_size: 1
  max_detections: 300
  device: null
  class_map: {}                   # e.g. {lock: padlock} if model names differ
  review_empty: true
  review_unmapped_classes: false
  review_sample_rate: 0.05
  options: {}

review:
  export: flagged
  copy_images: true
  previews: true

imports: []
#  - name: loto_roboflow_v1           # the historical, manually annotated dataset
#    path: data/loto/legacy/roboflow_v1
#    format: yolo
#    labels_trusted: true
#    empty_labels_are_negatives: true # only if empty files really mean "reviewed, nothing here"
#    class_map: {lock: padlock, tag: lockout_tag}
#    ignore_classes: []

split:
  # Fractions of items (they must sum to 1; val/test may be 0). Split groups from dedup are
  # indivisible, so achieved fractions can deviate; the report explains how and why.
  train: 0.7
  val: 0.2
  test: 0.1
  seed: null                      # tie-break seed for NEW groups; null = project.seed
  require_nonempty: true          # give every requested split at least one new group if possible
  # Assignments persist: existing groups never move. If later grouping merges groups that
  # were assigned to different splits, `split` stops (exit 4). A targeted fix may only keep
  # the most protected historical split (test > val > train), e.g. {sg_3fa9c0e1b2d4: test}.
  # Anything else requires `split --resplit` (preview, reason, confirmation token).
  conflict_resolutions: {}

augmentation:
  enabled: true
  copies_per_image: 2
  min_visibility: 0.4
  # Conservative, realistic transforms for industrial imagery. Omitted keys are disabled.
  transforms:
    brightness_contrast: {p: 0.5, brightness_limit: 0.2, contrast_limit: 0.2}
    exposure_gamma:      {p: 0.3, gamma_limit: [80, 120]}
    blur:                {p: 0.15, blur_limit: 3}
    jpeg_compression:    {p: 0.3, quality_range: [60, 95]}
    gauss_noise:         {p: 0.2}
    rotate:              {p: 0.3, limit: 7}
    scale:               {p: 0.3, scale_limit: 0.15}
    safe_crop:           {p: 0.3}
    color_jitter:        {p: 0.3, hue: 0.03, saturation: 0.2}

training:
  model: yolo11s.pt
  epochs: 150
  imgsz: 960
  batch: 8
  device: null
  patience: 30
  runs_dir: runs
